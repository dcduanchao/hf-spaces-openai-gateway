name: Deploy to Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "Dockerfile"
      - "requirements.txt"
      - "README.md"
      - "deploy_hf.py"
      - "mount_history_bucket.py"
      - "inspect_space.py"
      - ".github/workflows/deploy-hf-space.yml"

permissions:
  contents: read

concurrency:
  group: huggingface-space-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_ID: duan0320/hf-spaces-openai-gateway
    steps:
      - name: Check deployment secret
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret HF_TOKEN. Create it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub
        run: python -m pip install "huggingface_hub>=0.34,<2"

      - name: Create or update Docker Space
        run: python deploy_hf.py "$HF_SPACE_ID"

      - name: Mount private history bucket
        run: python mount_history_bucket.py

      - name: Deployment URL
        run: echo "https://huggingface.co/spaces/$HF_SPACE_ID"
